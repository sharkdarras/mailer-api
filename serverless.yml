service: mailer

provider:
  name: aws
  runtime: nodejs22.x
  stage: dev
  region: us-east-1

functions:
  api:
    handler: src/api/lambda.handler
    events:
      - http:
          path: /{proxy+}
          method: any

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3000
